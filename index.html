    <script>
      // Defensive bridge for window.fetch to ensure writable setter in restricted iframe/browser environments
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if defineProperty fails
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
